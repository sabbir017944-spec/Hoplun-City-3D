<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hoplun City — 3D Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#a8bdc8;font-family:system-ui,Arial;color:white}#game{position:fixed;inset:0}#hud{position:fixed;left:12px;top:12px;padding:10px 13px;border-radius:12px;background:#101a25bb;font-size:13px;line-height:1.5}.tag{position:fixed;right:12px;top:12px;background:#17202bbd;padding:8px 12px;border-radius:12px;font-weight:700}.pad{position:fixed;bottom:24px;left:22px;width:118px;height:118px;border-radius:50%;background:#ffffff30;border:1px solid #ffffff55;display:none;touch-action:none}.stick{position:absolute;left:35px;top:35px;width:48px;height:48px;border-radius:50%;background:#ffffff8a;border:1px solid white}.look{position:fixed;right:0;bottom:0;width:48%;height:55%;display:none;touch-action:none}#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#111a25b5;padding:8px 12px;border-radius:12px;font-size:12px;white-space:nowrap}@media(pointer:coarse){.pad,.look{display:block}#hint{bottom:155px}}
</style></head><body><div id="game"></div><div id="hud">🏙️ <b>HOPLUN FIELD · 3D DEMO</b><br>WASD / joystick: move<br>Mouse / right side: look<br>Shift: run</div><div class="tag">3D Prototype</div><div id="hint">Field environment inspired by your photos · fictional layout</div><div class="pad" id="pad"><div class="stick" id="stick"></div></div><div class="look" id="look"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa8bdc8);scene.fog=new THREE.Fog(0xa8bdc8,70,230);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8eaff,0x526143,2));const sun=new THREE.DirectionalLight(0xfff1d4,2.7);sun.position.set(-40,60,30);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
function box(x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y+h/2,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
// Field-centered scene: natural grass, worn patches, path, low curb, trees, and a distant generic industrial backdrop.
const grassCanvas=document.createElement('canvas');grassCanvas.width=512;grassCanvas.height=512;const gctx=grassCanvas.getContext('2d');gctx.fillStyle='#657d4e';gctx.fillRect(0,0,512,512);for(let i=0;i<17000;i++){let x=Math.random()*512,y=Math.random()*512;gctx.strokeStyle=['#81945f','#4c6b3d','#9aa56c','#526f43'][Math.floor(Math.random()*4)];gctx.globalAlpha=.2+Math.random()*.3;gctx.beginPath();gctx.moveTo(x,y);gctx.lineTo(x+(Math.random()-.5)*3,y-2-Math.random()*5);gctx.stroke()}gctx.globalAlpha=1;const grassTex=new THREE.CanvasTexture(grassCanvas);grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping;grassTex.repeat.set(9,9);const grassMat=new THREE.MeshStandardMaterial({map:grassTex,roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(160,160),grassMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const asphalt=mat(0x434949),concrete=mat(0x9b9d97),wall=mat(0xb9c2c1),blue=mat(0x9db6c1),glass=new THREE.MeshStandardMaterial({color:0x426575,roughness:.3,metalness:.15});
box(0,.04,0,92,.08,12,asphalt);box(0,.08,9,92,.12,5,concrete);box(0,.08,-13,90,.12,4,concrete);
box(0,.1,29,72,.2,3,concrete);box(0,.1,-31,72,.2,3,concrete);
box(-39,.2,0,1,.4,62,concrete);box(39,.2,0,1,.4,62,concrete);
function tree(x,z,scale=1){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18*scale,.3*scale,2.8*scale,8),mat(0x60452e));trunk.position.set(x,1.4*scale,z);trunk.castShadow=true;scene.add(trunk);for(let k=0;k<4;k++){const crown=new THREE.Mesh(new THREE.SphereGeometry(1.7*scale,12,10),mat([0x3e6840,0x4f7945,0x527f4b][k%3]));crown.position.set(x+(Math.random()-.5)*1.4,2.7*scale+k*.45*scale,z+(Math.random()-.5)*1.4);crown.castShadow=true;scene.add(crown)}}
for(let i=0;i<12;i++)tree(-43+i*7.8,37+(i%2)*2,.9+Math.random()*.3);for(let i=0;i<8;i++)tree(-42+i*12,-37,.8);
for(let x=-34;x<=34;x+=17){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.07,.12,4.5,8),mat(0x3e4546));pole.position.set(x,2.25,11.5);scene.add(pole);const lamp=new THREE.Mesh(new THREE.SphereGeometry(.18,8,8),mat(0xffedc2));lamp.position.set(x,4.5,11.5);scene.add(lamp)}
// Distant, simplified non-specific factory shapes only; not a real facility layout.
box(-25,0,-52,30,12,15,wall);box(16,0,-54,38,15,16,blue);box(-25,12,-52,30,.6,15,mat(0x56676b));box(16,15,-54,38,.6,16,mat(0x56676b));
for(let x=-36;x<=-14;x+=5)box(x,3,-44.4,1.4,2.6,.12,glass);for(let x=-1;x<=33;x+=6)box(x,4,-45.8,1.5,3.2,.12,glass);
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.9,4,8),mat(0x263e59));body.position.y=1.15;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),mat(0xc99d7d));head.position.y=1.9;player.add(head);scene.add(player);player.position.set(0,0,22);
let yaw=0,pitch=-.15,moveX=0,moveY=0,keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock?.());addEventListener('mousemove',e=>{if(document.pointerLockElement){yaw-=e.movementX*.002;pitch=Math.max(-.55,Math.min(.45,pitch-e.movementY*.002))}});
const pad=document.getElementById('pad'),stick=document.getElementById('stick');let active=false,padCenter={x:0,y:0};pad.addEventListener('pointerdown',e=>{active=true;pad.setPointerCapture(e.pointerId);let r=pad.getBoundingClientRect();padCenter={x:r.left+r.width/2,y:r.top+r.height/2};moveStick(e)});pad.addEventListener('pointermove',e=>{if(active)moveStick(e)});pad.addEventListener('pointerup',()=>{active=false;moveX=moveY=0;stick.style.transform='translate(0,0)'});function moveStick(e){let dx=e.clientX-padCenter.x,dy=e.clientY-padCenter.y,l=Math.hypot(dx,dy),max=38;if(l>max){dx=dx*max/l;dy=dy*max/l}moveX=dx/max;moveY=-dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}
let lookTouch=null;const look=document.getElementById('look');look.addEventListener('pointerdown',e=>{lookTouch={x:e.clientX,y:e.clientY};look.setPointerCapture(e.pointerId)});look.addEventListener('pointermove',e=>{if(lookTouch){yaw-=(e.clientX-lookTouch.x)*.006;pitch=Math.max(-.55,Math.min(.45,pitch-(e.clientY-lookTouch.y)*.004));lookTouch={x:e.clientX,y:e.clientY}}});look.addEventListener('pointerup',()=>lookTouch=null);
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)+moveY;let side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+moveX;let len=Math.hypot(f,side);if(len>1){f/=len;side/=len}let speed=(keys.shift?8:4.4);player.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*side)*speed*dt;player.position.z+=(-Math.cos(yaw)*f+Math.sin(yaw)*side)*speed*dt;player.position.x=Math.max(-54,Math.min(54,player.position.x));player.position.z=Math.max(-52,Math.min(55,player.position.z));if(len>.08)player.rotation.y=yaw+Math.atan2(side,f);let target=new THREE.Vector3(player.position.x,1.5,player.position.z);let camDir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));camera.position.copy(target).addScaledVector(camDir,-7);camera.position.y+=2.2;camera.lookAt(target.clone().add(new THREE.Vector3(0,1,0)));renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
