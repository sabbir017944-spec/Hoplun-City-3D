<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hoplun Field 3D</title>
<style>

</style></head><body><div id="game"></div>
<div id="hud"><b>🌿 HOPLUN FIELD · 3D</b><br>Move: WASD / joystick<br>Look: mouse / right side drag<br>Run: Shift / RUN button</div><div class="tag">FIELD EXPLORER</div><div id="hint">Fictional field scene · mobile-friendly 3D demo</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9cc3d5);scene.fog=new THREE.FogExp2(0x9cc3d5,.007);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);

const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});

function box(x,y,z,w,h,d,m){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y+h/2,z)}
const cv=document.createElement('canvas');cv.width=cv.height=512;const cx=cv.getContext('2d');cx.fillStyle='#607d48';cx.fillRect(0,0,512,512);for(let i=0;i<26000;i++){let x=Math.random()*512,y=Math.random()*512;cx.strokeStyle=['#8ca765','#496b3d','#a0ad72','#536f42'][Math.random()*4|0];cx.globalAlpha=.15+Math.random()*.35;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+(Math.random()-.5)*3,y-2-Math.random()*7);cx.stroke()}cx.globalAlpha=1;
const grassTex=new THREE.CanvasTexture(cv);grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping;grassTex.repeat.set(12,12);const grassMat=new THREE.MeshStandardMaterial({map:grassTex,roughness:1});
const ground=mesh(new THREE.PlaneGeometry(180,180),grassMat,0,0,0,false,true);ground.rotation.x=-Math.PI/2;
// broad field, surrounding walkways, curbs and small worn patches
const concrete=mat(0x9b9d98),road=mat(0x454b4b),path=mat(0xb3b1a6),border=mat(0x777e78);
box(0,.035,0,92,.07,10,road);box(0,.06,7.3,92,.12,3.2,path);box(0,.06,-9,90,.12,3,path);box(0,.07,29,72,.14,2.8,path);box(0,.07,-31,72,.14,2.8,path);
box(-40,.1,0,1.1,.2,62,border);box(40,.1,0,1.1,.2,62,border);box(0,.1,30,74,.2,.25,border);box(0,.1,-32,74,.2,.25,border);
const patchMat=mat(0x796f50);for(let i=0;i<26;i++){const p=mesh(new THREE.CircleGeometry(1+Math.random()*1.8,12),patchMat,(Math.random()-.5)*65,.025,(Math.random()-.5)*55,false,true);p.rotation.x=-Math.PI/2;p.scale.set(1+Math.random()*2,.6+Math.random(),1)}
// Scattered tiny grass tufts
const tuftMat=mat(0x3e5e36);for(let i=0;i<420;i++){const x=(Math.random()-.5)*72,z=(Math.random()-.5)*58;if(Math.abs(z)<6)continue;const t=mesh(new THREE.ConeGeometry(.11+Math.random()*.12,.35+Math.random()*.35,4),tuftMat,x,.18,z,false,true);t.rotation.z=(Math.random()-.5)*.35}
// trees along edge, not a real-site arrangement
function tree(x,z,s=1){mesh(new THREE.CylinderGeometry(.18*s,.27*s,2.7*s,7),mat(0x62462e),x,1.35*s,z);for(let n=0;n<3;n++){const crown=mesh(new THREE.SphereGeometry(1.5*s,10,8),mat([0x416d42,0x527b46,0x5d8549][n]),x+(Math.random()-.5)*.8,2.7*s+n*.45*s,z+(Math.random()-.5)*.8);crown.scale.set(1,1.05,1)}}for(let i=0;i<12;i++)tree(-43+i*7.8,38+(i%2)*2,.85+Math.random()*.25);for(let i=0;i<9;i++)tree(-42+i*10,-39,.75);
// soft distant skyline and generic industrial backdrop
const distant=mat(0x9aaeb2),factory=mat(0xb5c1bf),roof=mat(0x65777b),window=mat(0x526f7a,.4);
box(-24,0,-56,30,11,15,factory);box(15,0,-58,36,14,16,distant);box(-24,11,-56,30,.5,15,roof);box(15,14,-58,36,.5,16,roof);
for(let x=-35;x<=-14;x+=5)box(x,3,-48.3,1.5,2.5,.12,window);for(let x=-1;x<=31;x+=6)box(x,4,-49.7,1.6,3,.12,window);
// light posts, benches, path details
for(let x=-33;x<=33;x+=16.5){mesh(new THREE.CylinderGeometry(.07,.12,4.3,8),mat(0x41494a),x,2.15,10.5);mesh(new THREE.BoxGeometry(.55,.16,.32),mat(0xffedc2),x,4.35,10.5)}
for(let x of [-22,22]){box(x,.15,18,3,.3,.8,mat(0x806b4b));box(x,.55,18,3,.15,.8,mat(0x785e3f));for(let dx of [-1.2,1.2])box(x+dx,.15,18,.12,.7,.12,mat(0x45494a))}
const player=new THREE.Group();const torso=mesh(new THREE.CapsuleGeometry(.32,.68,4,8),mat(0x2c4d6b),0,1.1,0,false);torso.position.y=1.1;player.add(torso);
const head=mesh(new THREE.SphereGeometry(.24,14,12),mat(0xc99b78),0,1.85,0,false);head.position.y=1.85;player.add(head);
const armL=mesh(new THREE.CapsuleGeometry(.09,.42,3,6),mat(0x2c4d6b),-.42,1.1,0,false);armL.position.set(-.4,1.12,0);player.add(armL);const armR=mesh(new THREE.CapsuleGeometry(.09,.42,3,6),mat(0x2c4d6b),.42,1.1,0,false);armR.position.set(.4,1.12,0);player.add(armR);
const legL=mesh(new THREE.CapsuleGeometry(.12,.48,3,6),mat(0x26343d),-.16,.48,0,false);legL.position.set(-.16,.48,0);player.add(legL);const legR=mesh(new THREE.CapsuleGeometry(.12,.48,3,6),mat(0x26343d),.16,.48,0,false);legR.position.set(.16,.48,0);player.add(legR);scene.add(player);player.position.set(0,0,21);
let yaw=0,pitch=-.12,moveX=0,moveY=0,keys={},running=false;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
renderer.domElement.addEventListener('click',()=>{if(matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()});addEventListener('mousemove',e=>{if(document.pointerLockElement){yaw-=e.movementX*.002;pitch=Math.max(-.5,Math.min(.4,pitch-e.movementY*.002))}});
const pad=document.getElementById('pad'),stick=document.getElementById('stick');let active=false,padCenter={x:0,y:0};pad.addEventListener('pointerdown',e=>{active=true;pad.setPointerCapture(e.pointerId);const r=pad.getBoundingClientRect();padCenter={x:r.left+r.width/2,y:r.top+r.height/2};moveStick(e)});pad.addEventListener('pointermove',e=>{if(active)moveStick(e)});pad.addEventListener('pointerup',padReset);pad.addEventListener('pointercancel',padReset);function padReset(){active=false;moveX=moveY=0;stick.style.transform='translate(0,0)'}function moveStick(e){let dx=e.clientX-padCenter.x,dy=e.clientY-padCenter.y,l=Math.hypot(dx,dy),max=39;if(l>max){dx*=max/l;dy*=max/l}moveX=dx/max;moveY=-dy/max;stick.style.transform='translate('+dx+'px,'+dy+'px)'}
let lookTouch=null;const look=document.getElementById('look');look.addEventListener('pointerdown',e=>{lookTouch={x:e.clientX,y:e.clientY};look.setPointerCapture(e.pointerId)});look.addEventListener('pointermove',e=>{if(lookTouch){yaw-=(e.clientX-lookTouch.x)*.006;pitch=Math.max(-.5,Math.min(.4,pitch-(e.clientY-lookTouch.y)*.004));lookTouch={x:e.clientX,y:e.clientY}}});look.addEventListener('pointerup',()=>lookTouch=null);look.addEventListener('pointercancel',()=>lookTouch=null);
const runBtn=document.getElementById('run');runBtn.addEventListener('pointerdown',e=>{e.preventDefault();running=true});runBtn.addEventListener('pointerup',()=>running=false);runBtn.addEventListener('pointercancel',()=>running=false);runBtn.addEventListener('pointerleave',()=>running=false);
const clock=new THREE.Clock();let camPos=new THREE.Vector3();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),time=clock.elapsedTime;let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)+moveY;let side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+moveX;let len=Math.hypot(f,side);if(len>1){f/=len;side/=len}const sprint=keys.shift||running,speed=sprint?7.6:4.2;player.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*side)*speed*dt;player.position.z+=(-Math.cos(yaw)*f+Math.sin(yaw)*side)*speed*dt;player.position.x=Math.max(-55,Math.min(55,player.position.x));player.position.z=Math.max(-52,Math.min(53,player.position.z));if(len>.06){player.rotation.y=yaw+Math.atan2(side,f);const swing=Math.sin(time*(sprint?11:7))*Math.min(len,1);legL.rotation.x=swing*.65;legR.rotation.x=-swing*.65;armL.rotation.x=-swing*.45;armR.rotation.x=swing*.45}else{legL.rotation.x*=.85;legR.rotation.x*=.85;armL.rotation.x*=.85;armR.rotation.x*=.85}
const target=new THREE.Vector3(player.position.x,1.5,player.position.z);const dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));const desired=target.clone().addScaledVector(dir,-6.8);desired.y+=2.05;camPos.lerp(desired,1-Math.exp(-7*dt));camera.position.copy(camPos);camera.lookAt(target.clone().add(new THREE.Vector3(0,.65,0)));renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
